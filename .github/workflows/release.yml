# Build to Nexus in one run.
#
#   git tag v0.91 && git push origin v0.91   build, test, package, hash, scan, publish the GitHub
#                                            release, upload to Nexus Mods (mod 198515)
#   Actions > Release > Run workflow         the same, stopping before anything is published
#
# The tag must match the version in CMakeLists.txt, and release_notes/<version>.md must exist. Its
# first line and "## " sections become the Nexus changelog. A retry skips what already exists.
#
# The files released and uploaded are the ones this run built and hashed, unchanged. A VirusTotal
# detection doesn't stop the release, because unsigned files draw machine-learning false positives;
# the results go in the release notes and the run summary.
#
# Secrets: NEXUS_API_KEY, VIRUSTOTAL_API_KEY.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    env:
      MSVC_TOOLSET: "14.44"
    outputs:
      version: ${{ steps.version.outputs.version }}
      virustotal: ${{ steps.scan.outputs.zip_report }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version and the release notes
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(WhichPlugin VERSION ([0-9.]+)'
          if (-not $m) { throw 'No version in CMakeLists.txt' }
          $version = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in CMakeLists.txt"
          }
          if (-not (Test-Path "release_notes/$version.md")) { throw "release_notes/$version.md is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=%MSVC_TOOLSET% || exit /b 1
          cl 2>&1 | findstr /C:"Version"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_HOST_TRIPLET=x64-windows-static-md -DVCPKG_OVERLAY_TRIPLETS=triplets || exit /b 1
          cmake --build build || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1
          dumpbin /exports build\WhichPlugin.dll | findstr /C:"SKSEPlugin_Load" || exit /b 1
          dumpbin /exports build\WhichPlugin.dll | findstr /C:"SKSEPlugin_Version" || exit /b 1

      - name: Package and hash
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The zip's root is the game's Data folder, so the documents go in a folder of their own
          # instead of landing in Data.
          $plugins = New-Item -ItemType Directory -Force stage/SKSE/Plugins
          $docs = New-Item -ItemType Directory -Force stage/SKSE/Plugins/WhichPlugin/licenses
          Copy-Item build\WhichPlugin.dll, build\WhichPlugin.pdb, config\WhichPlugin.ini $plugins
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $docs.Parent
          Copy-Item build\_deps\commonlib-src\COPYING.txt "$docs\CommonLibSSE-NG.txt"
          Copy-Item build\_deps\commonlib-src\EXCEPTIONS.md "$docs\CommonLibSSE-NG-EXCEPTIONS.md"
          Copy-Item build\_deps\commonlib-src\licenses\LICENSE-MIT.txt "$docs\CommonLibSSE-NG-legacy-MIT.txt"
          Copy-Item build\_deps\commonlib-src\licenses\LICENSE-hde64.txt "$docs\hde64.txt"
          foreach ($p in 'directxmath', 'directxtk', 'fmt', 'nlohmann-json', 'rapidcsv', 'simpleini', 'spdlog', 'toml11', 'xbyak') {
            Copy-Item "build\vcpkg_installed\x64-windows-static-md\share\$p\copyright" "$docs\$p.txt"
          }
          # The Papyrus script, compiled locally (tools/build_papyrus.py), and its source for other mods.
          $scripts = New-Item -ItemType Directory -Force stage/Scripts
          $sources = New-Item -ItemType Directory -Force stage/Source/Scripts
          Copy-Item papyrus/Scripts/WhichPlugin.pex $scripts
          Copy-Item papyrus/Source/Scripts/WhichPlugin.psc $sources
          $dist = New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "stage/*" -DestinationPath "dist/WhichPlugin-$env:VERSION.zip"
          Copy-Item build\WhichPlugin.dll $dist
          $lines = Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # LF line endings, so "sha256sum -c SHA256SUMS.txt" works anywhere.
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          '## SHA-256', '```', $lines, '```', "Commit: $env:GITHUB_SHA" | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/WhichPlugin.dll
            dist/WhichPlugin-*.zip

      - name: VirusTotal scan
        id: scan
        continue-on-error: true
        shell: pwsh
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $md = @('| File | SHA-256 | VirusTotal |', '|---|---|---|')
          if (-not $env:VT_KEY) {
            foreach ($f in Get-ChildItem dist -File | Where-Object Extension -in '.dll', '.zip' | Sort-Object Name) {
              $md += "| ``$($f.Name)`` | ``$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())`` | not scanned |"
            }
            $md -join "`n" | Set-Content -Encoding utf8 vt-report.md
            'VirusTotal: no API key, skipped.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $headers = @{ 'x-apikey' = $env:VT_KEY.Trim() }
          $api = 'https://www.virustotal.com/api/v3'
          $files = Get-ChildItem dist -File | Where-Object Extension -in '.dll', '.zip' | Sort-Object Name
          $scans = foreach ($f in $files) {
            $id = (Invoke-RestMethod -Method Post "$api/files" -Headers $headers -Form @{ file = $f }).data.id
            [pscustomobject]@{ File = $f.Name; Sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); Id = $id; Analysis = $null }
          }
          # Wait for each analysis (up to 20 minutes in all).
          $deadline = (Get-Date).AddMinutes(20)
          while (($scans | Where-Object { -not $_.Analysis }) -and (Get-Date) -lt $deadline) {
            Start-Sleep 30
            foreach ($s in $scans | Where-Object { -not $_.Analysis }) {
              $a = (Invoke-RestMethod "$api/analyses/$($s.Id)" -Headers $headers).data.attributes
              if ($a.status -eq 'completed') { $s.Analysis = $a }
            }
          }
          $details = @()
          foreach ($s in $scans) {
            $link = "https://www.virustotal.com/gui/file/$($s.Sha)"
            if ($s.File -like '*.zip') { "zip_report=$link" >> $env:GITHUB_OUTPUT }
            if (-not $s.Analysis) { $md += "| ``$($s.File)`` | ``$($s.Sha)`` | [still running]($link) |"; continue }
            $st = $s.Analysis.stats
            $flagged = $st.malicious + $st.suspicious
            $total = $st.malicious + $st.suspicious + $st.undetected + $st.harmless
            $md += "| ``$($s.File)`` | ``$($s.Sha)`` | [$flagged of $total flagged]($link) |"
            $hits = $s.Analysis.results.PSObject.Properties.Value | Where-Object { $_.category -in 'malicious', 'suspicious' }
            foreach ($h in $hits | Sort-Object engine_name) { $details += "- ``$($s.File)``: $($h.engine_name): $($h.result)" }
          }
          if ($details) { $md += '', 'Detections:', ''; $md += $details }
          $md -join "`n" | Set-Content -Encoding utf8 vt-report.md
          '## VirusTotal', ($md -join "`n") | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }

      - name: Write the release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = Get-Content -Raw "release_notes/$env:VERSION.md"
          $verify = "## Verification`n`n"
          if (Test-Path vt-report.md) { $verify += (Get-Content -Raw vt-report.md) + "`n`n" }
          $verify += "Built by GitHub Actions from commit $env:GITHUB_SHA ([run](https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)), and attached here unchanged.`n"
          [IO.File]::WriteAllText("$PWD\dist-notes.md", $notes.TrimEnd() + "`n`n" + $verify)

      - uses: actions/upload-artifact@v5
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/
            dist-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      VT_LINK: ${{ needs.build.outputs.virustotal }}
      # Only a tag publishes. A manual run stops at the dry run below.
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: release

      - name: Check the hashes
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release create "v$VERSION" --verify-tag --title "Which Plugin $VERSION" --notes-file dist-notes.md --latest dist/*
          fi

      - name: Upload to Nexus Mods
        run: |
          args=(--tag "v$VERSION" --zip "dist/WhichPlugin-$VERSION.zip" --notes dist-notes.md --virustotal "$VT_LINK")
          if [ "$PUBLISH" != "true" ]; then args+=(--dry-run); fi
          python3 tools/nexus_release.py "${args[@]}"
