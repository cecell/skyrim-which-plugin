; Which Plugin - Console Search settings. Delete a line (or this file) to use its default.
; The game reads this file when it starts, so restart it after a change.

[General]
; The short console command. The long one, WhichPlugin, always works.
; Change this if another mod already uses "wp". 1 to 16 letters and digits.
sShortCommand = wp

; How much goes into Documents\My Games\Skyrim Special Edition\SKSE\WhichPlugin.log:
; trace, debug, info, warn or error.
sLogLevel = info

; How many result lines the console shows. Saving to a file (> name) always gets every line.
iMaxConsoleLines = 100

; How results look when you give no -c or -d: normal, concise (IDs only) or detail (one aligned row each).
sDefaultLayout = normal

[Output]
; Files written with > name go to Documents\My Games\Skyrim Special Edition\wp.
; 1 also allows full paths and ".." (for example > D:\notes\swords.csv).
bWriteFileAnywhere = 0

; 1: "> name" won't replace a file that already exists; use ">! name" to replace it.
bOverwriteNeedsConfirm = 0

[Open]
; 1: "wp open" opens the output folder, and "wp open last" the last file written.
bAllowOpenFolders = 1

; 1: "wp help --web", "wp uesp" and "wp json" open pages in your web browser.
bAllowOpenURL = 1

[Variables]
; How many variables you can set with "wp export", and how long one value can be (characters).
; They're kept in Documents\My Games\Skyrim Special Edition\wp\vars.json.
iMaxVariables = 1000
iMaxVariableLength = 100000

; 1: $CLIPBOARD gives the text on the Windows clipboard.
bAllowClipboardRead = 1
